version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blockchain_db
    environment:
      POSTGRES_DB: blockchain_sustainability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: blockchain_dashboard
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=blockchain_sustainability
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
